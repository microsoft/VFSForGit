name: VFS for Git

run-name: "${{ inputs.run_name || (inputs.git_overlay_url && format('VFS for Git: {0} (preview git)', inputs.source_ref || github.ref_name)) || (inputs.source_ref && format('VFS for Git: {0}', inputs.source_ref)) || 'VFS for Git' }}"

on:
  pull_request:
    branches: [ master, releases/shipped, vnext ]
  push:
    branches: [ master, releases/shipped, vnext ]
  workflow_dispatch:
    inputs:
      git_version:
        description: 'Microsoft Git version tag to include in the build (leave empty for default)'
        required: false
        type: string
      run_name:
        description: 'Optional display name for this run (used for cross-repo automation)'
        required: false
        type: string
      source_ref:
        description: 'Commit or branch to build and test (leave empty for the dispatched ref; workflows and their scripts always come from the dispatched ref)'
        required: false
        type: string
      git_overlay_url:
        description: 'URL of a zip that overlays the installed microsoft/git in the functional tests; use {arch} for x64 or arm64 (leave empty to test the released git)'
        required: false
        type: string
      git_overlay_sha256_x64:
        description: 'Expected SHA-256 of the x64 overlay zip (required with git_overlay_url)'
        required: false
        type: string
      git_overlay_sha256_arm64:
        description: 'Expected SHA-256 of the arm64 overlay zip (required with git_overlay_url)'
        required: false
        type: string
      require_sparse_index_tests:
        description: 'Fail if a sparse-index functional test (AutoSparseIndex*, SparseIndexMountTests, ConeManagementHookTests; not *WithoutGitSupport*) is ignored or skipped, or if none ran'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  checks: read

env:
  GIT_VERSION: ${{ github.event.inputs.git_version || 'v2.56.1.vfs.0.1' }}

jobs:
  validate:
    runs-on: windows-2025
    name: Validation
    outputs:
      skip: ${{ steps.check.outputs.result }}
      source_sha: ${{ steps.source.outputs.sha }}

    steps:
    - name: Look for prior successful runs
      id: check
      if: github.event.inputs.git_version == '' && github.event.inputs.source_ref == '' && github.event.inputs.git_overlay_url == ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        result-encoding: string
        script: |
          /*
            * It would be nice if GitHub Actions offered a convenient way to avoid running
            * successful workflow runs _again_ for the respective commit (or for a tree-same one):
            * We would expect the same outcome in those cases, right?
            *
            * Let's check for such a scenario: Look for previous runs that have been successful
            * and that correspond to the same commit, or at least a tree-same one. If there is
            * one, skip running the build and tests _again_.
            *
            * There are challenges, though: We need to require those _jobs_ to succeed before PRs
            * can be merged. You can mark workflow _jobs_ as required on GitHub, but not
            * _workflows_. So if those jobs are now simply skipped, the requirement isn't met and
            * the PR cannot be merged. We can't just skip the job. Instead, we need to run the job
            * _but skip every single step_ so that the job can "succeed".
            */
            try {
            // Figure out workflow ID, commit and tree
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const workflow_id = run.workflow_id;
            const head_sha = run.head_sha;
            const tree_id = run.head_commit.tree_id;

            /*
             * If the given workflow run was itself a "skip" run that references another
             * run, follow the chain to find the deepest *actual* successful, non-skipped
             * run, so we don't end up pointing at a chain of skip-runs.
             */
            const SKIP_NOTICE_RE = /^Skipping: There already is a successful run: (.+)$/
            const RUN_URL_RE = /\/actions\/runs\/(\d+)/
            const MAX_CHAIN_LENGTH = 10
            async function resolveSkipChain(initialRunId, initialRunUrl) {
              let currentRunId = initialRunId
              let currentRunUrl = initialRunUrl
              console.log(`Resolving skip chain starting at ${currentRunUrl}`)
              for (let i = 0; i < MAX_CHAIN_LENGTH; i++) {
                let referencedUrl = null
                try {
                  const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: currentRunId,
                  })
                  const validationJob = jobsData.jobs.find((j) => j.name === 'Validation')
                  if (!validationJob) {
                    console.log(`No 'Validation' job found on ${currentRunUrl}; treating as the real run`)
                    return currentRunUrl
                  }

                  const { data: annotations } = await github.rest.checks.listAnnotations({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    check_run_id: validationJob.id,
                  })
                  for (const annotation of annotations) {
                    const match = annotation.message && annotation.message.match(SKIP_NOTICE_RE)
                    if (match) {
                      referencedUrl = match[1]
                      break
                    }
                  }
                } catch (e) {
                  // If we cannot inspect this run, fall back to the URL we already have
                  console.log(`Failed to inspect ${currentRunUrl}: ${e.message}; stopping chain resolution`)
                  return currentRunUrl
                }

                if (!referencedUrl) {
                  console.log(`${currentRunUrl} is not a skip-run; using it as the resolved run`)
                  return currentRunUrl
                }

                console.log(`${currentRunUrl} is a skip-run referencing ${referencedUrl}; following the chain`)

                const idMatch = referencedUrl.match(RUN_URL_RE)
                if (!idMatch) {
                  console.log(`Could not parse a run ID from ${referencedUrl}; stopping chain resolution`)
                  return referencedUrl
                }

                const referencedId = Number(idMatch[1])
                let referencedRun
                try {
                  const response = await github.rest.actions.getWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: referencedId,
                  })
                  referencedRun = response.data
                } catch (e) {
                  console.log(`Could not fetch referenced run ${referencedUrl}: ${e.message}; stopping chain resolution`)
                  return currentRunUrl
                }

                if (referencedRun.status !== 'completed' || referencedRun.conclusion !== 'success') {
                  console.log(`Referenced run ${referencedUrl} is no longer usable (status=${referencedRun.status}, conclusion=${referencedRun.conclusion}); stopping chain resolution`)
                  return currentRunUrl
                }

                currentRunId = referencedRun.id
                currentRunUrl = referencedRun.html_url
              }
              console.log(`Reached MAX_CHAIN_LENGTH (${MAX_CHAIN_LENGTH}); stopping at ${currentRunUrl}`)
              return currentRunUrl
            }

            // See whether there is a successful run for that commit or tree
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 500,
              workflow_id,
            });
            // first look at commit-same runs, then at finished ones, then at in-progress ones
            const rank = (a) => (a.status === 'in_progress' ? 0 : (head_sha === a.head_sha ? 2 : 1))
            const demoteInProgressToEnd = (a, b) => (rank(b) - rank(a))
            for (const run of runs.workflow_runs.sort(demoteInProgressToEnd)) {
              if (head_sha !== run.head_sha && tree_id !== run.head_commit?.tree_id) continue
              if (context.runId === run.id) continue // do not wait for the current run to finish ;-)
              if (run.event === 'workflow_dispatch') continue // skip runs that were started manually: they can override the Git version

              if (run.status === 'in_progress') {
                // poll until the run is done
                const pollIntervalInSeconds = 30
                let seconds = 0
                for (;;) {
                  console.log(`Found existing, in-progress run at ${run.html_url}; Waiting for it to finish (waited ${seconds} seconds so far)...`)
                  await new Promise((resolve) => { setTimeout(resolve, pollIntervalInSeconds * 1000) })
                  seconds += pollIntervalInSeconds

                  const { data: polledRun } = await github.rest.actions.getWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id
                  })
                  if (polledRun.status !== 'in_progress') break
                }
              }

              if (run.status === 'completed' && run.conclusion === 'success') {
                console.log(`Found previous successful run at ${run.html_url} (head_sha=${run.head_sha}, tree_id=${run.head_commit?.tree_id})`)
                const resolvedUrl = await resolveSkipChain(run.id, run.html_url)
                core.notice(`Skipping: There already is a successful run: ${resolvedUrl}`)
                return resolvedUrl
              }
            }
            return ''
          } catch (e) {
            core.error(e)
            core.warning(e)
          }

    - name: Checkout source
      if: steps.check.outputs.result == ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Resolve source ref
      id: source
      if: inputs.source_ref != ''
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SOURCE_REF: ${{ inputs.source_ref }}
      run: |
        $ref = [uri]::EscapeDataString($env:SOURCE_REF)
        $sha = gh api "repos/$env:GITHUB_REPOSITORY/commits/$ref" --jq .sha
        if ($LASTEXITCODE -ne 0 -or $sha -notmatch '^[0-9a-f]{40}$') {
          Write-Host "::error::Cannot resolve source_ref '$env:SOURCE_REF'"
          exit 1
        }
        "sha=$sha" >> $env:GITHUB_OUTPUT
        Write-Host "::notice title=Source::Building and testing $env:SOURCE_REF ($sha)"

    - name: Verify git overlay checksums
      if: inputs.git_overlay_url != ''
      shell: pwsh
      env:
        OVERLAY_URL: ${{ inputs.git_overlay_url }}
        OVERLAY_SHA256_X64: ${{ inputs.git_overlay_sha256_x64 }}
        OVERLAY_SHA256_ARM64: ${{ inputs.git_overlay_sha256_arm64 }}
      run: |
        if (-not $env:OVERLAY_URL.Contains('{arch}')) {
          Write-Host "::error::git_overlay_url must contain {arch}"
          exit 1
        }
        foreach ($arch in 'x64', 'arm64') {
          $expected = [Environment]::GetEnvironmentVariable("OVERLAY_SHA256_$($arch.ToUpperInvariant())")
          if (-not $expected) {
            Write-Host "::error::git_overlay_sha256_$arch is required with git_overlay_url"
            exit 1
          }
          $url = $env:OVERLAY_URL.Replace('{arch}', $arch)
          $zip = Join-Path $env:RUNNER_TEMP "git-overlay-$arch.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($actual -ne $expected.Trim()) {
            Write-Host "::error::SHA-256 mismatch for $url (expected $expected, actual $actual)"
            exit 1
          }
          Write-Host "::notice title=Git overlay::$url SHA-256 $actual"
        }

    - name: Validate Microsoft Git version
      if: steps.check.outputs.result == ''
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        & "$env:GITHUB_WORKSPACE\.github\workflows\scripts\validate_release.ps1" `
          -Repository microsoft/git `
          -Tag $env:GIT_VERSION && `
        Write-Host ::notice title=Validation::Using microsoft/git version $env:GIT_VERSION

    - name: Download microsoft/git installers
      if: steps.check.outputs.result == ''
      shell: cmd
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release download %GIT_VERSION% --repo microsoft/git --pattern "Git*.exe" --dir MicrosoftGit

    - name: Create Git install script
      if: steps.check.outputs.result == ''
      shell: cmd
      run: |
        >MicrosoftGit\install.bat (
          echo @ECHO OFF
          echo SETLOCAL
          echo.
          echo IF "%%PROCESSOR_ARCHITECTURE%%"=="AMD64" ^(
          echo     SET GIT_ARCH=64-bit
          echo ^) ELSE IF "%%PROCESSOR_ARCHITECTURE%%"=="ARM64" ^(
          echo     SET GIT_ARCH=arm64
          echo ^) ELSE ^(
          echo     ECHO Unknown architecture: %%PROCESSOR_ARCHITECTURE%%
          echo     exit 1
          echo ^)
          echo.
          echo FOR /F "tokens=* USEBACKQ" %%%%F IN ^( `where /R %%~dp0 Git*-%%GIT_ARCH%%.exe` ^) DO SET GIT_INSTALLER=%%%%F
          echo.
          echo SET LOGDIR=%%~dp0\logs
          echo IF EXIST %%LOGDIR%% ^( rmdir /S /Q %%LOGDIR%% ^)
          echo mkdir %%LOGDIR%%
          echo.
          echo ECHO Installing Git ^(%%GIT_ARCH%%^)...
          echo %%GIT_INSTALLER%% /LOG="%%LOGDIR%%\git.log" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /ALLOWDOWNGRADE=1
        )

    - name: Upload microsoft/git installers
      if: steps.check.outputs.result == ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: MicrosoftGit
        path: MicrosoftGit

  build:
    runs-on: ${{ matrix.architecture == 'arm64' && 'windows-11-arm' || 'windows-2025' }}
    name: Build and Unit Test
    needs: validate

    strategy:
      matrix:
        configuration: [ Release ]
        architecture: [ x64, arm64 ]
      fail-fast: false

    steps:
    - name: Skip this job if there is a previous successful run
      if: needs.validate.outputs.skip != ''
      id: skip
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          core.info(`Skipping: There already is a successful run: ${{ needs.validate.outputs.skip }}`)
          return true

    - name: Checkout source
      if: steps.skip.outputs.result != 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: src
        ref: ${{ needs.validate.outputs.source_sha }}

    - name: Install .NET SDK
      if: steps.skip.outputs.result != 'true'
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    - name: Add MSBuild to PATH
      if: steps.skip.outputs.result != 'true'
      uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

    - name: Build VFS for Git
      if: steps.skip.outputs.result != 'true'
      shell: cmd
      run: src\scripts\Build.bat ${{ matrix.configuration }} 0.2.173.2 minimal ${{ matrix.architecture }}

    - name: Run unit tests
      if: steps.skip.outputs.result != 'true'
      shell: cmd
      run: src\scripts\RunUnitTests.bat ${{ matrix.configuration }} ${{ matrix.architecture }}

    - name: Create build artifacts
      if: steps.skip.outputs.result != 'true'
      shell: cmd
      run: src\scripts\CreateBuildArtifacts.bat ${{ matrix.configuration }} artifacts ${{ matrix.architecture }}

    - name: Upload functional tests drop
      if: steps.skip.outputs.result != 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: FunctionalTests_${{ matrix.configuration }}_${{ matrix.architecture }}
        path: artifacts\GVFS.FunctionalTests

    - name: Upload FastFetch drop
      if: steps.skip.outputs.result != 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: FastFetch_${{ matrix.configuration }}_${{ matrix.architecture }}
        path: artifacts\FastFetch

    - name: Upload GVFS installer
      if: steps.skip.outputs.result != 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: GVFS_${{ matrix.configuration }}_${{ matrix.architecture }}
        path: artifacts\GVFS.Installers

  functional_tests:
    name: Functional Tests
    needs: [validate, build]
    uses: ./.github/workflows/functional-tests.yaml
    with:
      skip: ${{ needs.validate.outputs.skip }}
      git_overlay_url: ${{ inputs.git_overlay_url }}
      git_overlay_sha256_x64: ${{ inputs.git_overlay_sha256_x64 }}
      git_overlay_sha256_arm64: ${{ inputs.git_overlay_sha256_arm64 }}

  sparse_index_summary:
    runs-on: ubuntu-latest
    name: Sparse-Index Test Summary
    needs: [validate, functional_tests]
    if: always() && needs.validate.result == 'success' && (inputs.git_overlay_url != '' || inputs.require_sparse_index_tests)
    permissions:
      actions: read

    steps:
    - name: Download functional test results
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: FunctionalTests_Results_*
        path: results

    - name: Summarize sparse-index tests
      shell: pwsh
      env:
        OVERLAY_URL: ${{ inputs.git_overlay_url }}
        OVERLAY_SHA256_X64: ${{ inputs.git_overlay_sha256_x64 }}
        OVERLAY_SHA256_ARM64: ${{ inputs.git_overlay_sha256_arm64 }}
        SOURCE_SHA: ${{ needs.validate.outputs.source_sha || github.sha }}
        REQUIRE_SPARSE_INDEX_TESTS: ${{ inputs.require_sparse_index_tests }}
      run: |
        $all = [ordered]@{ passed = 0; failed = 0; ignored = 0 }
        $sparse = [ordered]@{ passed = 0; failed = 0; ignored = 0 }
        $fixtures = @{}
        $slices = Get-ChildItem results -Recurse -Filter TestResult.xml
        foreach ($file in $slices) {
          [xml]$xml = Get-Content $file.FullName -Raw
          foreach ($case in $xml.SelectNodes('//test-case')) {
            $outcome = switch ($case.result) { 'Passed' { 'passed' } 'Failed' { 'failed' } default { 'ignored' } }
            $all[$outcome]++
            $fixture = ($case.classname -split '\.')[-1]
            # *WithoutGitSupport* fixtures test a git without the feature, so they skip themselves here.
            $isSparse = ($fixture -like 'AutoSparseIndex*' -or $fixture -in 'SparseIndexMountTests', 'ConeManagementHookTests') -and $fixture -notlike '*WithoutGitSupport*'
            if ($isSparse) {
              $sparse[$outcome]++
              if (-not $fixtures.ContainsKey($fixture)) { $fixtures[$fixture] = [ordered]@{ passed = 0; failed = 0; ignored = 0 } }
              $fixtures[$fixture][$outcome]++
            }
          }
        }

        $release = if ($env:OVERLAY_URL -match '/releases/download/([^/]+)/') { $Matches[1] } else { $env:OVERLAY_URL }
        $summary = [ordered]@{
          source_sha = $env:SOURCE_SHA
          git_overlay_release = $release
          git_overlay_url = $env:OVERLAY_URL
          git_overlay_sha256_x64 = $env:OVERLAY_SHA256_X64
          git_overlay_sha256_arm64 = $env:OVERLAY_SHA256_ARM64
          slices = $slices.Count
          all = $all
          sparse_index = $sparse
          fixtures = $fixtures
        }
        $summary | ConvertTo-Json -Depth 4 | Set-Content sparse-index-summary.json

        $md = @(
          '## Sparse-index functional tests',
          '',
          "- Source: ``$env:SOURCE_SHA``",
          "- Git overlay: $(if ($env:OVERLAY_URL) { "[$release]($env:OVERLAY_URL)" } else { 'none (released microsoft/git)' })",
          "- Overlay SHA-256: x64 ``$env:OVERLAY_SHA256_X64``, arm64 ``$env:OVERLAY_SHA256_ARM64``",
          "- Result files: $($slices.Count)",
          "- All tests: $($all.passed) passed, $($all.failed) failed, $($all.ignored) ignored",
          "- Sparse-index tests: $($sparse.passed) passed, $($sparse.failed) failed, $($sparse.ignored) ignored",
          '',
          '| Fixture | Passed | Failed | Ignored |',
          '|---|---|---|---|'
        )
        foreach ($name in $fixtures.Keys | Sort-Object) {
          $f = $fixtures[$name]
          $md += "| $name | $($f.passed) | $($f.failed) | $($f.ignored) |"
        }
        $md -join "`n" >> $env:GITHUB_STEP_SUMMARY

        if ($env:REQUIRE_SPARSE_INDEX_TESTS -eq 'true') {
          if ($sparse.ignored -gt 0) {
            Write-Host "::error::$($sparse.ignored) sparse-index functional tests were ignored or skipped"
            exit 1
          }
          if ($sparse.passed + $sparse.failed -eq 0) {
            Write-Host "::error::No sparse-index functional test ran"
            exit 1
          }
        }

    - name: Upload summary
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: SparseIndexSummary
        path: sparse-index-summary.json
        if-no-files-found: ignore

  upgrade_tests:
    name: Upgrade Tests
    needs: [validate, build]
    uses: ./.github/workflows/upgrade-tests.yaml
    with:
      skip: ${{ needs.validate.outputs.skip }}

  result:
    runs-on: ubuntu-latest
    name: Build, Unit and Functional Tests Successful
    needs: [validate, build, functional_tests, upgrade_tests]
    # Run even when a needed job failed, was cancelled or timed out: a skipped
    # job counts as a *passing* required check, so this job must not be skipped.
    # Jobs in this workflow never skip themselves on purpose (they skip their
    # steps instead), so anything other than `success` is a failure here.
    if: always()

    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "::error::Not all jobs succeeded: $RESULTS"
          exit 1

      - name: Success! # for easier identification of successful runs in the Checks Required for Pull Requests
        run: echo "Workflow run is successful!"
